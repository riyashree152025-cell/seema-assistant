# Gradle daemon: enough heap for AGP + KSP + Compose, and for compiling Kotlin in-process.
# In-process Kotlin compilation loads many classes, so metaspace gets 2 GB; no heap dumps
# (they were filling the project folder with multi-GB java_pid*.hprof files).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Fix for "Kotlin daemon terminated unexpectedly": compile Kotlin inside the Gradle daemon
# instead of a separate Kotlin daemon process (no second JVM to crash or run out of memory).
kotlin.compiler.execution.strategy=in-process
# Only used if the strategy above is ever switched back to "daemon".
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g

# Required: the app depends on AndroidX libraries.
android.useAndroidX=true
# Smaller, faster R classes (each module only sees its own resources).
android.nonTransitiveRClass=true
# Kotlin code style for the IDE.
kotlin.code.style=official
